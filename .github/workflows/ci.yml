name: CI

# Só valida. O deploy continua com a integração Workers Builds da Cloudflare
# (worker cube-front-github), que builda e publica a partir dos pushes.
# Este workflow não usa credenciais da Cloudflare e não faz deploy.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build do Worker (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores fictícios só para o pré-render do Next não quebrar.
      # Os valores reais ficam nas variáveis de build da Cloudflare.
      NEXT_PUBLIC_ALGOLIA_APP_ID: CI_PLACEHOLDER
      NEXT_PUBLIC_ALGOLIA_API_KEY: ci-placeholder
      NEXT_PUBLIC_ALGOLIA_CATALOG_INDEX: products_index
      NEXT_PUBLIC_HOST: https://api.example.com
      NEXT_PUBLIC_AUTH_SERVICE: /v1/auth
      NEXT_PUBLIC_CUSTOMER_SERVICE: /v1/customer
      NEXT_PUBLIC_ORDER_SERVICE: /v1/order
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build com OpenNext (o mesmo artefato que a Cloudflare publica)
        run: yarn opennextjs-cloudflare build

      - name: Validar o Worker com Wrangler (dry-run, sem deploy)
        run: yarn wrangler deploy --dry-run --outdir .wrangler/dry-run

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn tsc --noEmit
