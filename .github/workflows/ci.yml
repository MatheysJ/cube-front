name: CI

# Só valida. O deploy continua com a integração Workers Builds da Cloudflare
# (worker cube-front-github), que builda e publica a partir dos pushes.
# Este workflow não usa credenciais da Cloudflare e não faz deploy.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build do Worker (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build com OpenNext (o mesmo artefato que a Cloudflare publica)
        run: yarn opennextjs-cloudflare build

      - name: Validar o Worker com Wrangler (dry-run, sem deploy)
        run: yarn wrangler deploy --dry-run --outdir .wrangler/dry-run

  # Lint e typecheck ainda acusam problemas antigos no código.
  # Ficam visíveis em cada run sem bloquear o merge. Quando zerarem,
  # remova o `continue-on-error` para virarem obrigatórios.
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn tsc --noEmit
